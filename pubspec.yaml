name: offline_navigation
description: "Drop-in offline turn-by-turn navigation for Flutter on Android and iOS: route preview, voice guidance and map downloads, powered by Organic Maps."
version: 0.3.2
repository: https://github.com/fred-apina/offline_navigation
issue_tracker: https://github.com/fred-apina/offline_navigation/issues

screenshots:
  - description: 'A simulated drive with turn-by-turn instructions.'
    path: doc/images/navigation.gif
  - description: 'Live guidance on Android: next turn, remaining time and distance.'
    path: doc/images/android-guidance.png
  - description: 'Route preview on iOS.'
    path: doc/images/ios-preview.png
  - description: 'Turn-by-turn guidance on iOS.'
    path: doc/images/ios-guidance.png

topics:
  - navigation
  - maps
  - offline
  - routing
  - gps

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_plugin_android_lifecycle: ^2.0.31

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^26.1.2

flutter:
  plugin:
    platforms:
      android:
        package: io.github.fredapina.offline_navigation
        pluginClass: OfflineNavigationPlugin
      ios:
        pluginClass: OfflineNavigationPlugin
